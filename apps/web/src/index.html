<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyBharatConnects — NRI Real Estate Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO: primary meta tags -->
    <meta
      name="description"
      content="MyBharatConnects is a CRM platform for NRI real estate clients — connect with vetted vendors, manage cases, and track property services from anywhere."
    />
    <meta
      name="keywords"
      content="NRI real estate, property management India, vendor marketplace, real estate CRM"
    />
    <meta name="theme-color" content="#1f4e79" />
    <link rel="canonical" href="https://mybharatconnects.example/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mybharatconnects.example/" />
    <meta property="og:title" content="MyBharatConnects — NRI Real Estate Platform" />
    <meta
      property="og:description"
      content="MyBharatConnects is a CRM platform for NRI real estate clients — connect with vetted vendors, manage cases, and track property services from anywhere."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyBharatConnects — NRI Real Estate Platform" />
    <meta
      name="twitter:description"
      content="MyBharatConnects is a CRM platform for NRI real estate clients — connect with vetted vendors, manage cases, and track property services from anywhere."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
    />
    <!-- MyBharatConnects fonts (also imported in styles.css — belt + suspenders) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MyBharatConnects",
        "url": "https://mybharatconnects.example",
        "description": "MyBharatConnects is a CRM platform for NRI real estate clients — connect with vetted vendors, manage cases, and track property services from anywhere.",
        "logo": "https://mybharatconnects.example/og-image.png"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
